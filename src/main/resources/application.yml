spring:
  application:
    name: parcial-spring

  # ---------- MongoDB local (NoSQL) ----------
  data:
    mongodb:
      # Se puede sobreescribir con la variable de entorno MONGODB_URI
      uri: ${MONGODB_URI:mongodb://localhost:27017/parcial_db}
      auto-index-creation: true

  # ---------- JPA / SQL (ejemplo con H2 en memoria) ----------
  datasource:
    url: jdbc:h2:mem:parcialdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

# ---------- Swagger / OpenAPI ----------
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
